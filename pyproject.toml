[project]
name = "applypilot"
version = "0.2.0"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"  # in practice 3.11: python-jobspy pins numpy==1.24.2 (no 3.12+ wheels); see ci.yml
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "patchright>=1.50",
    "python-dotenv>=1.2.2",  # CVE-2026-28684
    "pyyaml>=6.0",
    "pandas>=2.0",
    "mcp>=1.9",
    # Pinned to the one window (1.1.45-1.1.46) that has hours_old (added
    # 1.1.45, our code has called it since before this pin existed) without
    # jobspy's own markdownify pin (added 1.1.47, and every later release
    # through 1.1.82 requires markdownify<0.14.0 -- directly incompatible
    # with our own markdownify>=0.14.1 below; there's no version that
    # satisfies both). The unpinned >=1.1 this replaced let pip resolve to
    # whatever was newest at install time; 1.1.13 predated hours_old
    # entirely (TypeError: unexpected keyword argument), anything >=1.1.47
    # conflicts on markdownify.
    "python-jobspy>=1.1.45,<1.1.47",
    "markdownify>=0.14.1",
    "websocket-client>=1.0",
    "python-docx>=1.1",
    "pypdf>=6.13.3",  # CVE-2026-48156/48155/48735/49461/49460/54531/54530 + GHSA-jm82-fx9c-mx94
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "psutil>=5.9"]  # psutil: root-level watchdog.py + its tests
# 2026-09-04 sentence-diversity bake-off (data/experiments/
# deterministic_slotfiller_20260902/): cross-encoder/quora-distilroberta-
# base beat cosine similarity, per-batch embedding centering, and LLM-as-
# judge on a real hand-labeled precision/recall comparison. Optional, not
# a base dependency -- pulls in torch, ~865MB on disk (measured: torch
# ~543MB + model weights ~318MB), and semantic_match.py's cross-encoder
# functions degrade gracefully (return None) when this extra isn't
# installed, exactly like embed_texts already does for a down Ollama.
# Install with: pip install -e ".[cross_encoder]"
cross_encoder = ["sentence-transformers>=3.0"]

[project.scripts]
applypilot = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/ibarrajo/ApplyPilot"
Repository = "https://github.com/ibarrajo/ApplyPilot"
Issues = "https://github.com/ibarrajo/ApplyPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml", "src/applypilot/config/*.json"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` from repo root recurses into
# data/experiments/ too -- one-off exploration scripts (e.g. the reverted
# Vast.ai/local-model-server work, CLAUDE.md decisions #52-53) that were
# never meant to be part of the maintained suite and have their own
# unpinned, often-uninstalled deps (peft, torch, ...). Scope collection to
# the real test directory; run experiment scripts directly if needed.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# 2026-10-07: pinned explicitly. With no `select`, ruff's default rule set
# grew between versions and CI (unpinned `ruff>=0.1`) started failing on
# 60+ style rules nobody had opted into. These are ruff's long-standing
# defaults (pyflakes + the E4/E7/E9 error subset) plus import sorting.
# Add rule families deliberately, with their fixes, in their own commit.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Deliberate late imports: launcher re-exports orchestrator at the bottom to
# break a circular import; jobspy patches a third-party enum before importing
# the modules that use it.
"src/applypilot/apply/launcher.py" = ["E402"]
"src/applypilot/discovery/jobspy.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# typer.Argument(...)/typer.Option(...) as parameter defaults is the required
# Typer idiom (cli.py) -- Typer introspects these objects at import time to
# build the CLI; moving the calls into the function body (B008's usual fix)
# would break the CLI entirely, not just silence a false positive.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
