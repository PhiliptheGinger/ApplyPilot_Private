# North Carolina mega-corps / major employers (v3).
#
# PURPOSE: NC equivalent of Seattle mega-corp coverage.
# Use this list to avoid startup-only sampling bias when searching.

diagnosis: |
  Startup/VC directories tend to under-represent large employers. This file
  ensures NC searches include high-volume enterprise hiring funnels (banking,
  telecom, healthcare, retail, and industrial technology) in addition to
  startup/scale-up opportunities.

companies:
  - name: "Bank of America"
    neighborhood: "Charlotte"
    domain: "fintech"
    size: "large (5000+)"
    careers_url: "https://careers.bankofamerica.com/"
    ats: "workday"
    tier: 2
    why_relevant: "Massive NC hiring volume across cyber, platform, SRE, and enterprise support."

  - name: "Truist"
    neighborhood: "Charlotte"
    domain: "fintech"
    size: "large (5000+)"
    careers_url: "https://careers.truist.com/"
    ats: "workday"
    tier: 2
    why_relevant: "Large engineering/support organization with steady NC req volume."

  - name: "Lowe's"
