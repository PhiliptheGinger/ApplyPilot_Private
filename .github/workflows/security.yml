name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for accurate secret scanning

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # numpy==1.24.2 (python-jobspy pin) cannot install on 3.12+; see ci.yml

      - name: Install pip-audit
        # Upgrade the packaging tools first so the audit reports on the
        # project's dependencies, not on an outdated runner-bundled pip.
        run: pip install --upgrade pip setuptools pip-audit

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Audit dependencies
        run: pip-audit --skip-editable
