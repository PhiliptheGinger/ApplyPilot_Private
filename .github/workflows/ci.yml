name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # also allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 only: python-jobspy 1.1.45-1.1.46 (pinned in pyproject.toml for
        # its hours_old/markdownify compatibility) hard-pins numpy==1.24.2,
        # which has no wheels and does not build on 3.12+. Widen this once
        # the jobspy pin moves (see docs/backlog.md).
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        run: pytest tests/ -v
